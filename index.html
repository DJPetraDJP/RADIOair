<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioAir - Music Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 90%;
            max-width: 500px;
            background: rgba(20, 20, 40, 0.9);
            border: 3px solid #ff00c8;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 0, 200, 0.5), 0 0 60px rgba(0, 255, 255, 0.3);
        }
        
        .title {
            text-align: center;
            color: #00ffff;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffff;
        }
        
        .subtitle {
            text-align: center;
            color: #ff00c8;
            font-size: 16px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #ff00c8;
        }
        
        .buttons-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .button-group {
            text-align: center;
        }
        
        .button-label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #fff;
        }
        
        .radio-button {
            width: 100%;
            padding: 15px;
            border: 2px solid;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .button-pink {
            background: #ff00c8;
            border-color: #ff00ff;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 200, 0.6);
        }
        
        .button-blue {
            background: #0099ff;
            border-color: #00ccff;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 153, 255, 0.6);
        }
        
        .button-green {
            background: #00ff00;
            border-color: #00ff88;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }
        
        .button-orange {
            background: #ffaa00;
            border-color: #ffcc00;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.6);
        }
        
        .radio-button:hover {
            transform: scale(1.05);
        }
        
        .radio-button:active {
            transform: scale(0.95);
        }
        
        .upload-section {
            background: rgba(255, 0, 200, 0.1);
            border: 2px solid #ff00c8;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .upload-title {
            color: #ff00c8;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 0 0 10px #ff00c8;
        }
        
        .song-input {
            margin-bottom: 12px;
        }
        
        .song-label {
            display: block;
            color: #00ffff;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        input[type="file"] {
            width: 100%;
            padding: 8px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            border-radius: 5px;
            color: #00ffff;
            cursor: pointer;
        }
        
        .song-name {
            color: #00ff00;
            font-size: 11px;
            margin-top: 3px;
            word-break: break-all;
        }
        
        .status {
            text-align: center;
            color: #00ffff;
            font-size: 12px;
            margin-top: 15px;
        }
        
        .now-playing {
            text-align: center;
            color: #ffaa00;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🎵 RADIO AIR</div>
        <div class="subtitle">Music Stream & Interactive</div>
        
        <div class="upload-section">
            <div class="upload-title">📤 UPLOAD DEINE SONGS</div>
            
            <div class="song-input">
                <label class="song-label">Song 1 (Pink):</label>
                <input type="file" id="song1" accept="audio/*">
                <div class="song-name" id="name1">-</div>
            </div>
            
            <div class="song-input">
                <label class="song-label">Song 2 (Blau):</label>
                <input type="file" id="song2" accept="audio/*">
                <div class="song-name" id="name2">-</div>
            </div>
            
            <div class="song-input">
                <label class="song-label">Song 3 (Grün):</label>
                <input type="file" id="song3" accept="audio/*">
                <div class="song-name" id="name3">-</div>
            </div>
            
            <div class="song-input">
                <label class="song-label">Song 4 (Orange):</label>
                <input type="file" id="song4" accept="audio/*">
                <div class="song-name" id="name4">-</div>
            </div>
            
            <div class="status">✓ Bereit. Lade bis zu 4 Songs hoch und drücke die Knöpfe zum abspielen!</div>
        </div>
        
        <div class="buttons-container">
            <div class="button-group">
                <span class="button-label">Song 1</span>
                <button class="radio-button button-pink" onclick="playSong(1)">▶</button>
            </div>
            <div class="button-group">
                <span class="button-label">Song 2</span>
                <button class="radio-button button-blue" onclick="playSong(2)">▶</button>
            </div>
            <div class="button-group">
                <span class="button-label">Song 3</span>
                <button class="radio-button button-green" onclick="playSong(3)">▶</button>
            </div>
            <div class="button-group">
                <span class="button-label">Song 4</span>
                <button class="radio-button button-orange" onclick="playSong(4)">▶</button>
            </div>
        </div>
        
        <div class="now-playing" id="nowPlaying">🎧 Warte auf deine Auswahl...</div>
    </div>
    
    <audio id="player" style="display:none;"></audio>
    
    <script>
        const songs = { 1: null, 2: null, 3: null, 4: null };
        const songNames = { 1: '-', 2: '-', 3: '-', 4: '-' };
        const audio = document.getElementById('player');
        
        // Upload Handler
        for (let i = 1; i <= 4; i++) {
            document.getElementById(`song${i}`).addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    songs[i] = URL.createObjectURL(file);
                    songNames[i] = file.name.length > 20 ? file.name.substring(0, 20) + '...' : file.name;
                    document.getElementById(`name${i}`).textContent = '✓ ' + songNames[i];
                }
            });
        }
        
        // Play Function
        function playSong(index) {
            if (songs[index]) {
                audio.src = songs[index];
                audio.play();
                document.getElementById('nowPlaying').textContent = `🎵 Spielt: ${songNames[index]}`;
            } else {
                document.getElementById('nowPlaying').textContent = `❌ Song ${index} nicht hochgeladen!`;
            }
        }
    </script>
</body>
</html>
